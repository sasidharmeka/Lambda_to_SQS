name: Deploy Lambdas

on:
  push:
    branches:
      - main
      - test
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        lambda:
          - dir: lambda_function_one         # folder for first Lambda
            handler: app.lambda_handler      # module.function
            base: SQS_MOCK_DATA_GENERATOR    # base Lambda name (branch suffix added)
            role_arn: arn:aws:iam::307946674363:role/SQS_Lambda_Role
            region: eu-north-1
          - dir: lambda_function_two         # folder for second Lambda
            handler: handler.lambda_handler
            base: AUTO_CONSUMER_FROM_SQS_LAMBDA
            role_arn: arn:aws:iam::307946674363:role/SQS_Lambda_Role
            region: eu-north-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip

      - name: Set environment variables (per-branch)
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "ENV=prod" >> $GITHUB_ENV
            echo "API_KEY=prod_api_key" >> $GITHUB_ENV
            echo "LOG_LEVEL=INFO" >> $GITHUB_ENV
          else
            echo "ENV=test" >> $GITHUB_ENV
            echo "API_KEY=test_api_key" >> $GITHUB_ENV
            echo "LOG_LEVEL=DEBUG" >> $GITHUB_ENV
          fi

      - name: Package ${{ matrix.lambda.base }}
        working-directory: ${{ matrix.lambda.dir }}
        shell: bash
        run: |
          set -e
          rm -rf package ../../${{ matrix.lambda.base }}.zip
          mkdir -p package

          # Copy all Python sources & common assets (no dependency vendoring)
          # Adjust patterns if your layout differs.
          shopt -s nullglob dotglob
          cp -r *.py package/ 2>/dev/null || true
          [[ -d src ]] && cp -r src/* package/ || true
          [[ -d lib ]] && cp -r lib/* package/ || true

          cd package
          zip -r ../../${{ matrix.lambda.base }}.zip .

      - name: Deploy ${{ matrix.lambda.base }} to AWS Lambda
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ matrix.lambda.region }}
        shell: bash
        run: |
          set -e
          REGION="${{ matrix.lambda.region }}"
          BASE="${{ matrix.lambda.base }}"
          FUNCTION_NAME="${BASE}_${{ github.ref_name }}"
          ZIP_FILE="${BASE}.zip"
          ROLE_ARN="${{ matrix.lambda.role_arn }}"
          HANDLER="${{ matrix.lambda.handler }}"

          echo "Deploying ${FUNCTION_NAME} in ${REGION} using ${ZIP_FILE}"

          if ! aws lambda get-function --function-name "$FUNCTION_NAME" --region "$REGION" >/dev/null 2>&1; then
            echo "Creating Lambda function $FUNCTION_NAME..."
            aws lambda create-function \
              --function-name "$FUNCTION_NAME" \
              --runtime python3.11 \
              --role "$ROLE_ARN" \
              --handler "$HANDLER" \
              --timeout 300 \
              --zip-file fileb://$ZIP_FILE \
              --region "$REGION" \
              --environment "Variables={ENV=$ENV,API_KEY=$API_KEY,LOG_LEVEL=$LOG_LEVEL}"
          else
            echo "Updating code for $FUNCTION_NAME..."
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --region "$REGION" \
              --zip-file fileb://$ZIP_FILE

            echo "Waiting for function code update to complete..."
            while true; do
              UPDATE_STATUS=$(aws lambda get-function --function-name "$FUNCTION_NAME" --region "$REGION" --query 'Configuration.LastUpdateStatus' --output text)
              if [ "$UPDATE_STATUS" = "Successful" ]; then
                echo "Function code update completed successfully."
                break
              elif [ "$UPDATE_STATUS" = "Failed" ]; then
                echo "Function code update failed."
                exit 1
              else
                echo "Update in progress, waiting..."
                sleep 5
              fi
            done

            echo "Updating configuration env vars..."
            aws lambda update-function-configuration \
              --function-name "$FUNCTION_NAME" \
              --region "$REGION" \
              --environment "Variables={ENV=$ENV,API_KEY=$API_KEY,LOG_LEVEL=$LOG_LEVEL}"
          fi
